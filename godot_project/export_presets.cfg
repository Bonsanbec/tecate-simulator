# Export presets for Tecate Simulator – Godot 4 (Mono)
# No secret data; keystore values are read from environment variables set by export.sh

[preset.0]
name="Android"
platform="Android"
runnable=true
custom_template=""
export_path="build/android/tecate.apk"
keystore/debug="${ANDROID_KEYSTORE_PATH}"
keystore/debug_user="${ANDROID_KEYSTORE_ALIAS}"
keystore/debug_password="${ANDROID_KEYSTORE_PASSWORD}"
keystore/release="${ANDROID_KEYSTORE_PATH}"
keystore/release_user="${ANDROID_KEYSTORE_ALIAS}"
keystore/release_password="${ANDROID_KEYSTORE_PASSWORD}"
package/unique_name="dev.bonsanbec.tecate"
package/name="Tecate Simulator"
version/code=1
version/name="1.0.0"
export_debug=false

[preset.1]
name="iOS"
platform="iOS"
runnable=true
custom_template=""
export_path="build/ios/tecate.xcodeproj"
bundle_identifier="dev.bonsanbec.tecate"
display_name="Tecate Simulator"
version="1.0"
build="1"
team_id="${IOS_TEAM_ID}"
signing_method="automatic"
export_debug=false
