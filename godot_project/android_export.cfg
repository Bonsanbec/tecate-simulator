# Android export configuration (godot_project/android_export.cfg)
# This file is version‑controlled but contains no secret data.
# Secret values are supplied via environment variables at export time.

[general]
# The path where the APK/AAB will be written (relative to project root)
export_path = "build/android/tecate.apk"
# Do not embed a keystore here; Godot will read the env vars defined below.

[android]
package/unique_name = "dev.bonsanbec.tecate"
package/name = "Tecate Simulator"
version/code = 1
version/name = "1.0.0"
# Keystore configuration – pulled from environment variables when running export.sh
# Expected env vars: ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_ALIAS, ANDROID_KEYSTORE_PASSWORD
keystore/debug = "$ANDROID_KEYSTORE_PATH"
keystore/debug_user = "$ANDROID_KEYSTORE_ALIAS"
keystore/debug_password = "$ANDROID_KEYSTORE_PASSWORD"

keystore/release = "$ANDROID_KEYSTORE_PATH"
keystore/release_user = "$ANDROID_KEYSTORE_ALIAS"
keystore/release_password = "$ANDROID_KEYSTORE_PASSWORD"